params:
  - id: frpc_server_addr
    type: string
    name: FRP Server Address
    description: "Hostname or IP address of the frps server."
    optional: false

  - id: frpc_server_port
    type: string
    name: FRP Server Port
    description: "Control port exposed by the frps server."
    default_value: "7000"
    optional: false

  - id: frpc_auth_token
    type: secret
    name: FRP Auth Token
    description: "Shared token used by this frpc client and the target frps server."
    optional: false

  - id: frpc_webserver_user
    type: string
    name: Web UI Username
    description: "Username for the embedded frpc Web UI."
    default_value: "admin"
    optional: false

  - id: frpc_webserver_password
    type: secret
    name: Web UI Password
    description: "Password for the embedded frpc Web UI."
    default_value: "$random(len=24)"
    optional: false

  - id: proxy_name
    type: string
    name: Initial Proxy Name
    description: "Name of the initial TCP proxy."
    default_value: "demo"
    optional: false

  - id: local_ip
    type: string
    name: Local Service Address
    description: "Host-network address of the service, such as 127.0.0.1 or a LAN IP."
    default_value: "127.0.0.1"
    optional: false

  - id: local_port
    type: string
    name: Local Service Port
    description: "TCP port of the local service to expose."
    default_value: "80"
    optional: false

  - id: remote_port
    type: string
    name: Remote Proxy Port
    description: "TCP port allowed and published by frps. The companion package defaults to 6000."
    default_value: "6000"
    optional: false

