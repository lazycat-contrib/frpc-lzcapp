version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/community.lazycat.app.frpc.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: frpc

build:
  toolchains: []
  run_buildscript: false

images:
  - id: frpc
    target: service
    service: frpc
    source: ghcr.io/fatedier/frpc
    channel: stable
    sort: semver
    tag_regex: '^v?0\.70\.1$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: frpc
    summary: Published from GitHub Actions
